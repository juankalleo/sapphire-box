name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:
  python-package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build info
        run: |
          printf '{"commit": "%s", "builtAt": "%s"}\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > sapphirebox/assets/web/build-info.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          mkdir -p release
          cp dist/*.whl dist/*.tar.gz release/

      - uses: actions/upload-artifact@v4
        with:
          name: sapphirebox-python-package
          path: release/*

  desktop-binaries:
    name: Desktop binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SapphireBox-Windows-x64.exe
            built: dist/SapphireBox.exe
          - os: macos-15-intel
            artifact: SapphireBox-macOS-x64
            built: dist/SapphireBox
          - os: ubuntu-latest
            artifact: SapphireBox-Linux-x64
            built: dist/SapphireBox

    steps:
      - uses: actions/checkout@v4

      - name: Stamp build info
        shell: bash
        run: |
          printf '{"commit": "%s", "builtAt": "%s"}\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > sapphirebox/assets/web/build-info.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]" pyinstaller

      - name: Build one-file executable
        run: >
          pyinstaller
          --name SapphireBox
          --onefile
          --collect-data sapphirebox.assets
          --collect-submodules sapphirebox
          sapphirebox/main.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.built }}" "release/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build info
        run: |
          printf '{"commit": "%s", "builtAt": "%s"}\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > android/app/src/main/assets/web/build-info.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see android/README.md for how to generate and store the release keystore. Without it every build would be signed with a different throwaway key, and nobody could ever install an update over a previous one without uninstalling first."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/sapphirebox-release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/sapphirebox-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/SapphireBox-Android-1.0.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SapphireBox-Android-1.0.0.apk
          path: release/SapphireBox-Android-1.0.0.apk

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [python-package, desktop-binaries, android-apk]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: find release -maxdepth 1 -type f -print

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${APP_VERSION}"
          fi

          if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Sapphire Box ${APP_VERSION}" \
              --notes "Sapphire Box ${APP_VERSION}"
          fi

          release_files=(
            "release/SapphireBox-Android-1.0.0.apk"
            "release/SapphireBox-Windows-x64.exe"
            "release/SapphireBox-macOS-x64"
            "release/SapphireBox-Linux-x64"
            "release/sapphirebox-${APP_VERSION}-py3-none-any.whl"
          )

          for file in "${release_files[@]}"; do
            test -f "${file}"
            gh release upload "${TAG_NAME}" "${file}" --clobber --repo "${GITHUB_REPOSITORY}"
          done
