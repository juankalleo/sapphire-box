[project]
name = "sapphirebox"
version = "1.0.0"
description = "Sapphire Box — biblioteca e scraper de mangas, manhwas e livros (sucessor em Python do FireScan)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "certifi",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
desktop = ["pywebview>=6.0"]

[project.scripts]
sapphirebox = "sapphirebox.cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sapphirebox*"]

[tool.setuptools.package-data]
"sapphirebox.assets" = [
    "data/*.json",
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/assets/*",
    "web/assets/favicons/*",
    "web/vendor/*",
]
